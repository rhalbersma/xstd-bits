name: MinGW

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  # canary.yml dispatches this nightly on main, the run its README badge shows.
  workflow_dispatch:

jobs:
  # Whether this pull request can reach what the ladders build; see changes.yml.
  changes:
    uses: ./.github/workflows/changes.yml

  # Every rung. The WinLibs release lookup lives in cpp-ci's install-winlibs action now.
  mingw_ladder:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: rhalbersma/cpp-ci/.github/workflows/mingw.yml@acbf0f0b3ed85dcabf95cd0d4806c0fa7c451ecf # main after rhalbersma/cpp-ci#83, with the std_test_suite adapters of rhalbersma/cpp-ci#82
    with:
      # A pull request builds only the floor and ceiling rungs, in Debug. The all gate cannot see what was skipped, so
      # the nightly canary covers it, building every rung and build type on main.
      reduce_on_pr: true

  # The same C++26 leg as gcc.yml's, over the other libstdc++ toolchain: no leg at C++23 holds the inplace column
  # in std::inplace_vector. The qualification rung is MinGW 16, this ladder having no development rung -- WinLibs
  # publishes no snapshot.
  mingw_cxx26:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: rhalbersma/cpp-ci/.github/workflows/mingw.yml@acbf0f0b3ed85dcabf95cd0d4806c0fa7c451ecf # main after rhalbersma/cpp-ci#83, with the std_test_suite adapters of rhalbersma/cpp-ci#82
    with:
      tiers: qualification
      cmake_args: -DXSTD_BITS_CXX_STANDARD=26

  # The name branch protection requires: green when the ladder passed, or when the pull request changes nothing it builds.
  all:
    name: mingw / all
    needs: [ changes, mingw_ladder ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Every leg succeeded, or none was needed
        env:
          BUILD: ${{ needs.changes.outputs.build }}
          RESULT: ${{ needs.mingw_ladder.result }}
        run: test "${BUILD}" = false || test "${RESULT}" = success
