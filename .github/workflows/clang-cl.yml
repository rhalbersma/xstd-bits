name: Clang-CL

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # canary.yml calls this weekly, so the stub stays callable itself.
  workflow_call:

jobs:
  # The msvc.yml ladder with clang-cl in front of the MSVC STL, on its own cache prefix. Still all three rungs, 2022 included: clang-cl is clang, so it deduces through the views' alias templates where the MSVC compiler at 2022 cannot, and this is what keeps the VS 2022 platform covered.
  clang_cl:
    uses: rhalbersma/cpp-ci/.github/workflows/visual-studio.yml@29fdd6605bf237863ad39c3919c2cf389cfb6d38 # v0.10.2
    with:
      toolset: ClangCL,host=x64
      preview_toolset_prefix: "ClangCL,"
      cache_prefix: clang-cl
