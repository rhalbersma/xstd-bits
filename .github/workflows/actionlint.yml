name: Actionlint

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # New here; with almost every workflow a "uses" stub, a typo in an input name is most of what can go wrong.
  actionlint:
    uses: rhalbersma/cpp-ci/.github/workflows/actionlint.yml@acbf0f0b3ed85dcabf95cd0d4806c0fa7c451ecf # main after rhalbersma/cpp-ci#83, with the std_test_suite adapters of rhalbersma/cpp-ci#82
