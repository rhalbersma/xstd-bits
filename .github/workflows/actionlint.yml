name: Actionlint

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # New here; with almost every workflow a "uses" stub, a typo in an input name is most of what can go wrong.
  actionlint:
    uses: rhalbersma/cpp-ci/.github/workflows/actionlint.yml@a634ddb30dc4da914d7eb281029e8f9bb85e2d63 # v0.16.0
