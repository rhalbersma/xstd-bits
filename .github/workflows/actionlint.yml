name: Actionlint

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # New here; with almost every workflow a "uses" stub, a typo in an input name is most of what can go wrong.
  actionlint:
    uses: rhalbersma/cpp-ci/.github/workflows/actionlint.yml@5e70b2dfcf6a2a4d8f8d442c65703588d198548c # v0.11.1
