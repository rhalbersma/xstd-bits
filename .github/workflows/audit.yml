name: Audit

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Every paragraph an inventory under doc/audit/ lists is accounted for, every paragraph a test cites is listed, and every name an include comment lists is used.
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the inventories against the citations
        run: python3 tools/audit.py

      - name: Check the include comments against the names their files use
        run: python3 tools/include_comments.py
