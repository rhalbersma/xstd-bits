name: Audit

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Every paragraph an inventory under doc/audit/ lists is accounted for, every paragraph a test cites is listed, every name an include comment lists is used, and every ranges:: names its namespace.
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the inventories against the citations
        run: python3 tools/audit.py

      - name: Check the include comments against the names their files use
        run: python3 tools/include_comments.py

      - name: "Check that every ranges:: says whose ranges it means"
        run: python3 tools/qualified_ranges.py

      - name: Check that the headers are layered and no container family includes another
        uses: rhalbersma/cpp-ci/.github/actions/layering@3387d6b86177322b3b2a81b84b45339fc2c47d5c # main after rhalbersma/cpp-ci#101, with each trunk suite test built on its own
        with:
          config: tools/layering.toml
