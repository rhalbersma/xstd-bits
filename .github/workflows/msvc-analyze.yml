name: MSVC-Analyze

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # MSVC's /analyze, in the role clang-tidy.yml fills for Clang, the flag compiling the whole tree. All three rungs, the 2022 one back for the reason msvc.yml states.
  msvc_analyze:
    uses: rhalbersma/cpp-ci/.github/workflows/msvc-analyze.yml@0e9948a4bd9f844797ce5b1c9b4c915a94cd665a # main after rhalbersma/cpp-ci#68, whose install-gcc fails its step when the PPA did not serve the compiler
    with:
      tiers: stable,qualification,development
