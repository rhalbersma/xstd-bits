name: MSVC-Analyze

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # MSVC's /analyze, in the role clang-tidy.yml fills for Clang; the 2026 generation, the flag compiling the whole tree. The 2022 rung is dropped for the reason msvc.yml states.
  msvc_analyze:
    uses: rhalbersma/cpp-ci/.github/workflows/msvc-analyze.yml@8156138fa6336f5d870e72e62b72033632a1c56b # v0.9.0
    with:
      tiers: qualification,development
