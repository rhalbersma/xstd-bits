name: MSVC-Analyze

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Whether this pull request can reach what the ladders build; see changes.yml.
  changes:
    uses: ./.github/workflows/changes.yml

  # MSVC's /analyze, in the role clang-tidy.yml fills for Clang, the flag compiling the whole tree. All three rungs, the 2022 one back for the reason msvc.yml states.
  msvc_analyze_ladder:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: rhalbersma/cpp-ci/.github/workflows/msvc-analyze.yml@2a7b3577168d22d62a9119b1913c6e0122e78994 # v0.14.0
    with:
      tiers: stable,qualification,development

  # The name branch protection requires: green when the ladder passed, or when the pull request changes nothing it builds.
  all:
    name: msvc_analyze / all
    needs: [ changes, msvc_analyze_ladder ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Every leg succeeded, or none was needed
        env:
          BUILD: ${{ needs.changes.outputs.build }}
          RESULT: ${{ needs.msvc_analyze_ladder.result }}
        run: test "${BUILD}" = false || test "${RESULT}" = success
