name: MSVC-Analyze

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # MSVC's /analyze, in the role clang-tidy.yml fills for Clang, the flag compiling the whole tree. All three rungs, the 2022 one back for the reason msvc.yml states.
  msvc_analyze:
    uses: rhalbersma/cpp-ci/.github/workflows/msvc-analyze.yml@b5161ff82d9d4cb1a123ed37c8b0b5295ce8044b # v0.11.0
    with:
      tiers: stable,qualification,development
