name: Sanitizers

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Every leg on every rung, leak detection on; all fifteen run now that the missing range adaptors are unused.
  sanitizers:
    uses: rhalbersma/cpp-ci/.github/workflows/sanitizers.yml@2a7b3577168d22d62a9119b1913c6e0122e78994 # main after rhalbersma/cpp-ci#76, whose ladders size their build by memory; tools/ci-local.sh runs its clang-tidy and gcovr scripts too
