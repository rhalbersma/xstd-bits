name: Sanitizers

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Every leg on every rung, leak detection on; all fifteen run now that the missing range adaptors are unused.
  sanitizers:
    uses: rhalbersma/cpp-ci/.github/workflows/sanitizers.yml@480aa17d38efd5c1641b861e9e1a0c6df053a451 # v0.10.3
