name: Sanitizers

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Every leg on every rung, leak detection on; all fifteen run now that the missing range adaptors are unused.
  sanitizers:
    uses: rhalbersma/cpp-ci/.github/workflows/sanitizers.yml@2f8912ef8f9fafc62871e85b09768468bc2e6cc4 # rhalbersma/cpp-ci#66, the build sized by memory
