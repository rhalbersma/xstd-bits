name: Sanitizers

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Every leg on every rung, leak detection on; all fifteen run now that the missing range adaptors are unused.
  sanitizers:
    uses: rhalbersma/cpp-ci/.github/workflows/sanitizers.yml@5e70b2dfcf6a2a4d8f8d442c65703588d198548c # v0.11.1
