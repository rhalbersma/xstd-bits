name: Scorecard

# Read-only at workflow level; the analysis's write grants sit on the job, which is least privilege rather than a requirement.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  branch_protection_rule:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

jobs:
  scorecard:
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    uses: rhalbersma/cpp-ci/.github/workflows/scorecard.yml@2a7b3577168d22d62a9119b1913c6e0122e78994 # main after rhalbersma/cpp-ci#76, whose ladders size their build by memory; tools/ci-local.sh runs its clang-tidy and gcovr scripts too
