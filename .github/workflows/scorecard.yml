name: Scorecard

# Read-only at workflow level; the analysis's write grants sit on the job, which is least privilege rather than a requirement.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  branch_protection_rule:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

jobs:
  scorecard:
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    uses: rhalbersma/cpp-ci/.github/workflows/scorecard.yml@acbf0f0b3ed85dcabf95cd0d4806c0fa7c451ecf # main after rhalbersma/cpp-ci#83, with the std_test_suite adapters of rhalbersma/cpp-ci#82
