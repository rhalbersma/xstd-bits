name: Clang-Tidy

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  clang_tidy:
    uses: rhalbersma/cpp-ci/.github/workflows/clang-tidy.yml@29fdd6605bf237863ad39c3919c2cf389cfb6d38 # v0.10.2
    with:
      # The generated per-header units, as run-clang-tidy matches them against the compile database's absolute paths. They are the one tree that cannot be named as a directory: they live in the build tree, under a path only this project's CMake knows.
      self_sufficiency_regex: ${{ github.workspace }}/build/test/header_self_sufficiency/.*
      test_dir: test/src
      # The per-header pass compiles standalone, so xstd-ints and xstd-misc (FetchContent) and Boost (vcpkg) must be named. FetchContent derives _deps/<name>-src from the declared name, so this path moves whenever that name does; an absent candidate is skipped silently, which turns a stale path into a file-not-found in the header pass.
      adapted_dirs: >-
        build/_deps/xstd-ints-src/include
        build/_deps/xstd-misc-src/include
        vcpkg_installed/x64-linux/include
        build/vcpkg_installed/x64-linux/include
