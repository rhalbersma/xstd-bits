name: CodeQL

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  # security-events on the job rather than at workflow level. Scorecard's Token-Permissions check subtracts a full point for a top-level security-events write and nothing for the same grant on a job, as long as the workflow still declares a top-level block -- which the contents: read above does. The called workflow cannot exceed what this job grants, so the grant has to live somewhere here either way. No inputs: c-cpp with security-extended is the shared workflow's default.
  codeql:
    permissions:
      contents: read
      security-events: write
    uses: rhalbersma/cpp-ci/.github/workflows/codeql.yml@8156138fa6336f5d870e72e62b72033632a1c56b # v0.9.0
