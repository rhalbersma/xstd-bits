name: Consumption

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # The last stub to arrive: the shared workflow could not express this library before cpp-ci v0.4.1.
  consumption:
    uses: rhalbersma/cpp-ci/.github/workflows/consumption.yml@5e70b2dfcf6a2a4d8f8d442c65703588d198548c # v0.11.1
    with:
      # CMakeLists.txt find_package()s boost_hash2 and boost_container unconditionally, so every configure here needs vcpkg.
      vcpkg: true
      # The revisions CMakeLists.txt pins; install(EXPORT) cannot export a FetchContent build tree, so installed dependencies are required.
      dependency_repos: |
        https://github.com/rhalbersma/xstd-ints.git 8067321b209f4128880560ff01d692858c3b5960
        https://github.com/rhalbersma/xstd-misc.git 88dba732bbb28b4e0d3491397e62c0f7453ee5a7
