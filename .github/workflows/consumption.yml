name: Consumption

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # The last stub to arrive: the shared workflow could not express this library before cpp-ci v0.4.1.
  consumption:
    uses: rhalbersma/cpp-ci/.github/workflows/consumption.yml@2a7b3577168d22d62a9119b1913c6e0122e78994 # main after rhalbersma/cpp-ci#76, whose ladders size their build by memory; tools/ci-local.sh runs its clang-tidy and gcovr scripts too
    with:
      # CMakeLists.txt find_package()s boost_hash2 and boost_container unconditionally, so every configure here needs vcpkg.
      vcpkg: true
      # The revisions CMakeLists.txt pins; install(EXPORT) cannot export a FetchContent build tree, so installed dependencies are required.
      dependency_repos: |
        https://github.com/rhalbersma/xstd-ints.git 790a41c78867c3116b07fa85c6b1b886d961eaf1
        https://github.com/rhalbersma/xstd-misc.git 2b877b3901cac75259b6735230a0af3b75c32d3f
