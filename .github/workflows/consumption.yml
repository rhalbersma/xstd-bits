name: Consumption

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # The last stub to arrive: the shared workflow could not express this library before cpp-ci v0.4.1.
  consumption:
    uses: rhalbersma/cpp-ci/.github/workflows/consumption.yml@9f3e580868b62debec276f6f257bfa9105fbb252 # main after rhalbersma/cpp-ci#108, which runs the compile budget
    with:
      # CMakeLists.txt find_package()s boost_hash2 and boost_container unconditionally, so every configure here needs vcpkg.
      vcpkg: true
      # The revisions CMakeLists.txt pins; install(EXPORT) cannot export a FetchContent build tree, so installed dependencies are required.
      dependency_repos: |
        https://github.com/rhalbersma/xstd-ints.git 2762980d657f3482059ca9cefc350dd6ff1674a8
        https://github.com/rhalbersma/xstd-misc.git 7154a9ee869ef1768b834ac419120baa4bec0098
