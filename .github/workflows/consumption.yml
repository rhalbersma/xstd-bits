name: Consumption

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # The last stub to arrive: the shared workflow could not express this library before cpp-ci v0.4.1.
  consumption:
    uses: rhalbersma/cpp-ci/.github/workflows/consumption.yml@36a6706f4bd71818af4f80ea97937aa31c2dc719 # main after rhalbersma/cpp-ci#116, v0.16.0 with rewritten tests written as bytes
    with:
      # CMakeLists.txt find_package()s boost_hash2 and boost_container unconditionally, so every configure here needs vcpkg.
      vcpkg: true
      # The revisions CMakeLists.txt pins; install(EXPORT) cannot export a FetchContent build tree, so installed dependencies are required.
      dependency_repos: |
        https://github.com/rhalbersma/xstd-ints.git e7cf26aea50d1877c315cbe14ba0b4704ece4226
        https://github.com/rhalbersma/xstd-misc.git 8921a26d9f1dc961bc79e37a44b9e070949aed79
