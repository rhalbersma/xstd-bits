name: Consumption

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # The last stub to arrive: the shared workflow could not express this library before cpp-ci v0.4.1.
  consumption:
    uses: rhalbersma/cpp-ci/.github/workflows/consumption.yml@83edc49715c3245dbff4406654c6f489af6a10e9 # main after rhalbersma/cpp-ci#75, whose clang-tidy and gcovr scripts tools/ci-local.sh runs too
    with:
      # CMakeLists.txt find_package()s boost_hash2 and boost_container unconditionally, so every configure here needs vcpkg.
      vcpkg: true
      # The revisions CMakeLists.txt pins; install(EXPORT) cannot export a FetchContent build tree, so installed dependencies are required.
      dependency_repos: |
        https://github.com/rhalbersma/xstd-ints.git 790a41c78867c3116b07fa85c6b1b886d961eaf1
        https://github.com/rhalbersma/xstd-misc.git 254e41cd94bf70c0fbd50074c44a8cbba3982052
