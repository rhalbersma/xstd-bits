name: GCC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  # canary.yml dispatches this nightly on main, the run its README badge shows.
  workflow_dispatch:

jobs:
  # Whether this pull request can reach what the ladders build; see changes.yml.
  changes:
    uses: ./.github/workflows/changes.yml

  # Every rung, and the rungs move with cpp-ci rather than with a local matrix. The one ladder that builds the benchmark tree, now that XSTD_BITS_BUILD_BENCHMARKS is off by default. Its Release legs run the smoke test benchmark/CMakeLists.txt registers -- --benchmark_min_time=1x, that it runs rather than what it costs -- so the benchmarks keep compiling and executing against the current API without every other leg paying to build them.
  gcc_ladder:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: rhalbersma/cpp-ci/.github/workflows/gcc.yml@1b5265b916e459cfe621a970e819b6b16a29c3c5 # main after rhalbersma/cpp-ci#81, whose install-gcc falls back to the Launchpad librarian when the toolchain PPA's mirror is down
    with:
      cmake_args: -DXSTD_BITS_BUILD_BENCHMARKS=ON
      # A pull request builds only the floor and ceiling rungs, in Debug. The all gate cannot see what was skipped, so
      # the nightly canary covers it, building every rung and build type on main.
      reduce_on_pr: true

  # The inplace column over std::inplace_vector: __cpp_lib_inplace_vector is C++26, so at the standard every other
  # leg compiles as, the two inplace cells stand on boost::container::static_vector instead and are never
  # constant-evaluated. CMakeLists.txt raises the standard for the test tree alone -- the INTERFACE a consumer
  # inherits stays at 23 -- and this is the leg that asks it to. No benchmarks: the ladder above builds those, and
  # this one is here for the storage it is the only leg to reach.
  #
  # Two rungs rather than one. The qualification rung is GCC 16, the oldest GCC carrying the header, and it is what
  # the storage has to keep working on. The development rung is where a storage this new earns the snapshot: C++26 is
  # a draft the library tracks rather than a standard it targets, and 17-SVN is the only leg that reports a change
  # to std::inplace_vector, or to anything else this column leans on, while it is still a change. The stable rung
  # stays out -- GCC 15 has no such header, so it would configure and then test static_vector a second time.
  gcc_cxx26:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: rhalbersma/cpp-ci/.github/workflows/gcc.yml@1b5265b916e459cfe621a970e819b6b16a29c3c5 # main after rhalbersma/cpp-ci#81, whose install-gcc falls back to the Launchpad librarian when the toolchain PPA's mirror is down
    with:
      tiers: qualification,development
      cmake_args: -DXSTD_BITS_CXX_STANDARD=26

  # 32-bit x86: a 32-bit size_t, 4-byte alignment for 64-bit integers, and no __int128. One rung in Debug, since what is under test is the target.
  i686:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: rhalbersma/cpp-ci/.github/workflows/gcc.yml@1b5265b916e459cfe621a970e819b6b16a29c3c5 # main after rhalbersma/cpp-ci#81, whose install-gcc falls back to the Launchpad librarian when the toolchain PPA's mirror is down
    with:
      arch: x86
      tiers: stable
      build_types: Debug

  # A release against libstdc++ with _GLIBCXX_ASSERTIONS, as several distributions build: NDEBUG turns assert off, and
  # the hardened library turns XSTD_BITS_ASSERT back on, so std::vector<bool> and bit_vector trap on the same misuse.
  hardened:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: rhalbersma/cpp-ci/.github/workflows/gcc.yml@1b5265b916e459cfe621a970e819b6b16a29c3c5 # main after rhalbersma/cpp-ci#81, whose install-gcc falls back to the Launchpad librarian when the toolchain PPA's mirror is down
    with:
      tiers: stable
      build_types: Release
      cxx_flags: -D_GLIBCXX_ASSERTIONS

  # The name branch protection requires: green when the ladder passed, or when the pull request changes nothing it builds.
  all:
    name: gcc / all
    needs: [ changes, gcc_ladder ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Every leg succeeded, or none was needed
        env:
          BUILD: ${{ needs.changes.outputs.build }}
          RESULT: ${{ needs.gcc_ladder.result }}
        run: test "${BUILD}" = false || test "${RESULT}" = success
