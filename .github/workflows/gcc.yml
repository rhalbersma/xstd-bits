name: GCC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # canary.yml calls this weekly, so the stub stays callable itself.
  workflow_call:

jobs:
  # Every rung, and the rungs move with cpp-ci rather than with a local matrix.
  #
  # The one ladder that builds the benchmark tree, now that XSTD_BITS_BUILD_BENCHMARKS is off by default.
  # Its Release legs run the smoke test benchmark/CMakeLists.txt registers -- --benchmark_min_time=1x, that
  # it runs rather than what it costs -- so the benchmarks keep compiling and executing against the current
  # API without every other leg paying to build them.
  gcc:
    uses: rhalbersma/cpp-ci/.github/workflows/gcc.yml@e2886b13f6fcd1eceb231652f816b016de41be1d # v0.8.1
    with:
      cmake_args: -DXSTD_BITS_BUILD_BENCHMARKS=ON
