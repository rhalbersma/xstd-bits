name: GCC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # canary.yml calls this weekly, so the stub stays callable itself.
  workflow_call:

jobs:
  # Every rung, and the rungs move with cpp-ci rather than with a local matrix. The one ladder that builds the benchmark tree, now that XSTD_BITS_BUILD_BENCHMARKS is off by default. Its Release legs run the smoke test benchmark/CMakeLists.txt registers -- --benchmark_min_time=1x, that it runs rather than what it costs -- so the benchmarks keep compiling and executing against the current API without every other leg paying to build them.
  gcc:
    uses: rhalbersma/cpp-ci/.github/workflows/gcc.yml@b5161ff82d9d4cb1a123ed37c8b0b5295ce8044b # v0.11.0
    with:
      cmake_args: -DXSTD_BITS_BUILD_BENCHMARKS=ON

  # The bounded column over std::inplace_vector: __cpp_lib_inplace_vector is C++26, so at the standard every other
  # leg compiles as, the three bounded cells stand on boost::container::static_vector instead and are never
  # constant-evaluated. CMakeLists.txt raises the standard for the test tree alone -- the INTERFACE a consumer
  # inherits stays at 23 -- and this is the leg that asks it to. No benchmarks: the ladder above builds those, and
  # this one is here for the storage it is the only leg to reach.
  #
  # Two rungs rather than one. The qualification rung is GCC 16, the oldest GCC carrying the header, and it is what
  # the storage has to keep working on. The development rung is where a storage this new earns the snapshot: C++26 is
  # a draft the library tracks rather than a standard it targets, and 17-SVN is the only leg that reports a change
  # to std::inplace_vector, or to anything else this column leans on, while it is still a change. The stable rung
  # stays out -- GCC 15 has no such header, so it would configure and then test static_vector a second time.
  gcc_cxx26:
    uses: rhalbersma/cpp-ci/.github/workflows/gcc.yml@b5161ff82d9d4cb1a123ed37c8b0b5295ce8044b # v0.11.0
    with:
      tiers: qualification,development
      cmake_args: -DXSTD_BITS_CXX_STANDARD=26
