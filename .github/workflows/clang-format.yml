name: Clang-Format

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Its own tier, deliberately left at stable: a formatter release reformats
  # the code base, which is not something a compiler bump should decide.
  clang_format:
    uses: rhalbersma/cpp-ci/.github/workflows/clang-format.yml@1b5265b916e459cfe621a970e819b6b16a29c3c5 # main after rhalbersma/cpp-ci#81, whose install-gcc falls back to the Launchpad librarian when the toolchain PPA's mirror is down
    with:
      # benchmark/ too, this repository carrying a benchmark tree of hand-written sources.
      paths: examples include test benchmark
