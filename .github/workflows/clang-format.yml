name: Clang-Format

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Its own tier, deliberately left at stable: a formatter release reformats
  # the code base, which is not something a compiler bump should decide.
  clang_format:
    uses: rhalbersma/cpp-ci/.github/workflows/clang-format.yml@480aa17d38efd5c1641b861e9e1a0c6df053a451 # v0.10.3
    with:
      # benchmark/ too, this repository carrying a benchmark tree of hand-written sources.
      paths: examples include test benchmark
