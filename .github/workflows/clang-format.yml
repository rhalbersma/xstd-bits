name: Clang-Format

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Its own tier, deliberately left at stable: a formatter release reformats
  # the code base, which is not something a compiler bump should decide.
  clang_format:
    uses: rhalbersma/cpp-ci/.github/workflows/clang-format.yml@83edc49715c3245dbff4406654c6f489af6a10e9 # main after rhalbersma/cpp-ci#75, whose clang-tidy and gcovr scripts tools/ci-local.sh runs too
    with:
      # benchmark/ too, this repository carrying a benchmark tree of hand-written sources.
      paths: examples include test benchmark
