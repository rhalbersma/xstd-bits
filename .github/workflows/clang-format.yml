name: Clang-Format

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Dispatch-only: with no .clang-format the LLVM fallback would report almost every file, and reformatting is a source change.
on:
  workflow_dispatch:

jobs:
  # Its own tier, left at stable: a formatter release reformats the code base.
  clang_format:
    uses: rhalbersma/cpp-ci/.github/workflows/clang-format.yml@8156138fa6336f5d870e72e62b72033632a1c56b # v0.9.0
    with:
      # benchmark/ too, this repository carrying a benchmark tree of hand-written sources.
      paths: examples include test benchmark
