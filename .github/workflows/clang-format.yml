name: Clang-Format

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Its own tier, deliberately left at stable: a formatter release reformats
  # the code base, which is not something a compiler bump should decide.
  clang_format:
    uses: rhalbersma/cpp-ci/.github/workflows/clang-format.yml@4bd632358dfeb4c79fa606f9dcb70ba0052acd8e # main after rhalbersma/cpp-ci#92, with the install-clang key-fetch retry of rhalbersma/cpp-ci#91
    with:
      # benchmark/ too, this repository carrying a benchmark tree of hand-written sources.
      paths: examples include test benchmark
