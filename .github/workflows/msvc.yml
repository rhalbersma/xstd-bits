name: MSVC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # canary.yml calls this weekly, so the stub stays callable itself.
  workflow_call:

jobs:
  # The 2026 generation only. C2976 is settled -- the views are class templates with their own deduction guides and MSVC 17 no longer reports it -- but the rung stays out for what replaced it: the two workarounds dropped once it left, auto(x) for decay_copy and one typename in the set primitives, are exactly what it fails on now. doc/design.md records that ledger; clang-cl.yml keeps its 2022 rung and covers the platform.
  msvc:
    uses: rhalbersma/cpp-ci/.github/workflows/visual-studio.yml@29fdd6605bf237863ad39c3919c2cf389cfb6d38 # v0.10.2
    with:
      tiers: qualification,development
