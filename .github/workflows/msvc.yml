name: MSVC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # canary.yml calls this weekly, so the stub stays callable itself.
  workflow_call:

jobs:
  # All three rungs. The 2022 one is back on trial: bit_span, bit_subspan and bit_set_view are class templates with their own deduction guides, so the alias-template shape MSVC 17 answered with "C2976: 'xstd::bit_set_view': too few template arguments" is gone. Whether that is the whole of what it could not do, only this rung reports.
  msvc:
    uses: rhalbersma/cpp-ci/.github/workflows/visual-studio.yml@29fdd6605bf237863ad39c3919c2cf389cfb6d38 # v0.10.2
    with:
      tiers: stable,qualification,development
