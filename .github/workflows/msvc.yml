name: MSVC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  # canary.yml dispatches this nightly on main, the run its README badge shows.
  workflow_dispatch:

jobs:
  # Whether this pull request can reach what the ladders build; see changes.yml.
  changes:
    uses: ./.github/workflows/changes.yml

  # All three rungs. C2976 went when the views became class templates with their own deduction guides, and the two workarounds the rung had paid for -- decay_copy in place of auto(x), one typename on a constrained parameter -- are back, so MSVC 17 builds this again.
  msvc_ladder:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: rhalbersma/cpp-ci/.github/workflows/visual-studio.yml@a634ddb30dc4da914d7eb281029e8f9bb85e2d63 # v0.16.0
    with:
      tiers: stable,qualification,development
      # A pull request builds only the floor and ceiling rungs, in Debug. The all gate cannot see what was skipped, so
      # the nightly canary covers it, building every rung and build type on main.
      reduce_on_pr: true

  # The MSVC STL's own tests of the containers with a counterpart, at the stable rung's tag, built against the library they
  # are written for, whose internals their support headers reach. One rung in Debug, since what is under test is the
  # mapping onto the subjects, not the compiler.
  std_test_suites:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: rhalbersma/cpp-ci/.github/workflows/visual-studio.yml@a634ddb30dc4da914d7eb281029e8f9bb85e2d63 # v0.16.0
    with:
      tiers: stable
      build_types: Debug
      cmake_args: -DXSTD_BITS_BUILD_STD_TEST_SUITES=ON

  # The name branch protection requires: green when the ladder and the suites passed, or when the pull request changes
  # nothing they build.
  all:
    name: msvc / all
    needs: [ changes, msvc_ladder, std_test_suites ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Every leg succeeded, or none was needed
        env:
          BUILD: ${{ needs.changes.outputs.build }}
          RESULT: ${{ needs.msvc_ladder.result }}
          SUITES: ${{ needs.std_test_suites.result }}
        run: test "${BUILD}" = false || { test "${RESULT}" = success && test "${SUITES}" = success; }
