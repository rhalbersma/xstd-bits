name: Clang

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  # canary.yml dispatches this nightly on main, the run its README badge shows.
  workflow_dispatch:

jobs:
  # Whether this pull request can reach what the ladders build; see changes.yml.
  changes:
    uses: ./.github/workflows/changes.yml

  # Every rung. The libc++ leg is its own workflow now; what is left here is the libstdc++ side.
  clang_ladder:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: rhalbersma/cpp-ci/.github/workflows/clang.yml@1b5265b916e459cfe621a970e819b6b16a29c3c5 # main after rhalbersma/cpp-ci#81, whose install-gcc falls back to the Launchpad librarian when the toolchain PPA's mirror is down
    with:
      # A pull request builds only the floor and ceiling rungs, in Debug. The all gate cannot see what was skipped, so
      # the nightly canary covers it, building every rung and build type on main.
      reduce_on_pr: true

  # The name branch protection requires: green when the ladder passed, or when the pull request changes nothing it builds.
  all:
    name: clang / all
    needs: [ changes, clang_ladder ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Every leg succeeded, or none was needed
        env:
          BUILD: ${{ needs.changes.outputs.build }}
          RESULT: ${{ needs.clang_ladder.result }}
        run: test "${BUILD}" = false || test "${RESULT}" = success
