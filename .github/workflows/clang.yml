name: Clang

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # canary.yml calls this weekly, so the stub stays callable itself.
  workflow_call:

jobs:
  # No inputs: every rung. The libc++ leg is its own workflow now; what is left here is the libstdc++ side.
  clang:
    uses: rhalbersma/cpp-ci/.github/workflows/clang.yml@b5161ff82d9d4cb1a123ed37c8b0b5295ce8044b # v0.11.0
