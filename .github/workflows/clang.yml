name: Clang

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  # canary.yml dispatches this weekly on main, the run its README badge shows.
  workflow_dispatch:

jobs:
  # No inputs: every rung. The libc++ leg is its own workflow now; what is left here is the libstdc++ side.
  clang:
    uses: rhalbersma/cpp-ci/.github/workflows/clang.yml@170191bd9ab421d871b53fb67682376a2695d8a9 # v0.13.0
