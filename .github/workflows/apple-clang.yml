name: Apple Clang

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # canary.yml calls this weekly, so the stub stays callable itself.
  workflow_call:

jobs:
  # Two rungs, Apple publishing no Clang trunk; the file keeps its name because the README badge is the workflow's path.
  apple_clang:
    uses: rhalbersma/cpp-ci/.github/workflows/apple-clang.yml@1c32e510e25b1d41e613cddc1b169655680f9a01 # main, past v0.11.1
