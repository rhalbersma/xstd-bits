name: Apple Clang

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # canary.yml calls this weekly, so the stub stays callable itself.
  workflow_call:

jobs:
  # Two rungs, Apple publishing no Clang trunk; the file keeps its name because the README badge is the workflow's path.
  apple_clang:
    uses: rhalbersma/cpp-ci/.github/workflows/apple-clang.yml@29fdd6605bf237863ad39c3919c2cf389cfb6d38 # v0.10.2
