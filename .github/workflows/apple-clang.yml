name: Apple Clang

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  # canary.yml dispatches this weekly on main, the run its README badge shows.
  workflow_dispatch:

jobs:
  # Two rungs, Apple publishing no Clang trunk; the file keeps its name because the README badge is the workflow's path.
  apple_clang:
    uses: rhalbersma/cpp-ci/.github/workflows/apple-clang.yml@0e9948a4bd9f844797ce5b1c9b4c915a94cd665a # main after rhalbersma/cpp-ci#68, whose install-gcc fails its step when the PPA did not serve the compiler
