name: Clang libc++

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  # canary.yml dispatches this weekly on main, the run its README badge shows.
  workflow_dispatch:

jobs:
  # The full ladder; the C++23 range adaptors libc++ lacks are no longer used, so all six legs pass.
  clang_libcxx:
    uses: rhalbersma/cpp-ci/.github/workflows/clang-libc++.yml@1c32e510e25b1d41e613cddc1b169655680f9a01 # v0.12.0
