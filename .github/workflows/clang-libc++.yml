name: Clang libc++

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # canary.yml calls this weekly, so the stub stays callable itself.
  workflow_call:

jobs:
  # The full ladder; the C++23 range adaptors libc++ lacks are no longer used, so all six legs pass.
  clang_libcxx:
    uses: rhalbersma/cpp-ci/.github/workflows/clang-libc++.yml@5e70b2dfcf6a2a4d8f8d442c65703588d198548c # v0.11.1
