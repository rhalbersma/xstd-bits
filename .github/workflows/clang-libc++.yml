name: Clang libc++

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  # canary.yml dispatches this nightly on main, the run its README badge shows.
  workflow_dispatch:

jobs:
  # Whether this pull request can reach what the ladders build; see changes.yml.
  changes:
    uses: ./.github/workflows/changes.yml

  # The full ladder; the C++23 range adaptors libc++ lacks are no longer used, so all six legs pass.
  clang_libcxx_ladder:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: rhalbersma/cpp-ci/.github/workflows/clang-libc++.yml@acbf0f0b3ed85dcabf95cd0d4806c0fa7c451ecf # main after rhalbersma/cpp-ci#83, with the std_test_suite adapters of rhalbersma/cpp-ci#82
    with:
      # A pull request builds only the floor and ceiling rungs, in Debug. The all gate cannot see what was skipped, so
      # the nightly canary covers it, building every rung and build type on main.
      reduce_on_pr: true

  # A release against libc++ in its fast hardening mode, the one meant for production: XSTD_BITS_ASSERT follows it on.
  hardened:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: rhalbersma/cpp-ci/.github/workflows/clang-libc++.yml@acbf0f0b3ed85dcabf95cd0d4806c0fa7c451ecf # main after rhalbersma/cpp-ci#83, with the std_test_suite adapters of rhalbersma/cpp-ci#82
    with:
      tiers: stable
      build_types: Release
      cxx_flags: -D_LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_FAST

  # The name branch protection requires: green when the ladder passed, or when the pull request changes nothing it builds.
  all:
    name: clang_libcxx / all
    needs: [ changes, clang_libcxx_ladder ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Every leg succeeded, or none was needed
        env:
          BUILD: ${{ needs.changes.outputs.build }}
          RESULT: ${{ needs.clang_libcxx_ladder.result }}
        run: test "${BUILD}" = false || test "${RESULT}" = success
