name: Clang libc++

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  # canary.yml dispatches this nightly on main, the run its README badge shows.
  workflow_dispatch:

jobs:
  # Whether this pull request can reach what the ladders build; see changes.yml.
  changes:
    uses: ./.github/workflows/changes.yml

  # The full ladder; the C++23 range adaptors libc++ lacks are no longer used, so all six legs pass.
  clang_libcxx_ladder:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: rhalbersma/cpp-ci/.github/workflows/clang-libc++.yml@4bd632358dfeb4c79fa606f9dcb70ba0052acd8e # main after rhalbersma/cpp-ci#92, with the install-clang key-fetch retry of rhalbersma/cpp-ci#91
    with:
      # A pull request builds only the floor and ceiling rungs, in Debug. The all gate cannot see what was skipped, so
      # the nightly canary covers it, building every rung and build type on main.
      reduce_on_pr: true

  # A release against libc++ in its fast hardening mode, the one meant for production: XSTD_BITS_ASSERT follows it on.
  hardened:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: rhalbersma/cpp-ci/.github/workflows/clang-libc++.yml@4bd632358dfeb4c79fa606f9dcb70ba0052acd8e # main after rhalbersma/cpp-ci#92, with the install-clang key-fetch retry of rhalbersma/cpp-ci#91
    with:
      tiers: stable
      build_types: Release
      cxx_flags: -D_LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_FAST

  # libc++'s own tests of the containers with a counterpart, at the stable rung's tag. One rung in Debug, since what is
  # under test is the mapping onto bit_vector, not the compiler.
  std_test_suites:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: rhalbersma/cpp-ci/.github/workflows/clang-libc++.yml@4bd632358dfeb4c79fa606f9dcb70ba0052acd8e # main after rhalbersma/cpp-ci#92, with the install-clang key-fetch retry of rhalbersma/cpp-ci#91
    with:
      tiers: stable
      build_types: Debug
      cmake_args: -DXSTD_BITS_BUILD_STD_TEST_SUITES=ON

  # The name branch protection requires: green when the ladder and the suites passed, or when the pull request changes
  # nothing they build.
  all:
    name: clang_libcxx / all
    needs: [ changes, clang_libcxx_ladder, std_test_suites ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Every leg succeeded, or none was needed
        env:
          BUILD: ${{ needs.changes.outputs.build }}
          RESULT: ${{ needs.clang_libcxx_ladder.result }}
          SUITES: ${{ needs.std_test_suites.result }}
        run: test "${BUILD}" = false || { test "${RESULT}" = success && test "${SUITES}" = success; }
