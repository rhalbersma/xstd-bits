name: Compile budget

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
    paths:
      - include/**
      - vcpkg.json
      - .github/workflows/compile-budget.yml
  workflow_dispatch:

jobs:
  # What each public header costs to include on its own, against the pull request's base: a count grown by more than 5% fails.
  compile_budget:
    uses: rhalbersma/cpp-ci/.github/workflows/compile-budget.yml@028e1b27ed0b090bae643130d60112e974baeaba # main after rhalbersma/cpp-ci#119, v0.16.0 with compile-budget's exclude and dependency_repos
    with:
      glob: xstd/**/*.hpp
      # The headers users include; a detail header is costed through the public ones that include it.
      exclude: "*/detail/*"
      # The revisions CMakeLists.txt pins, as headers on the include path; Boost comes from vcpkg.json.
      dependency_repos: |
        https://github.com/rhalbersma/xstd-ints.git e7cf26aea50d1877c315cbe14ba0b4704ece4226
        https://github.com/rhalbersma/xstd-misc.git 02a2477a7fd09b44b3db8eff5e45b73eea084d9d
      # One pass of the 126 headers takes about four minutes, and the time it reports never gates.
      repeat: 1
