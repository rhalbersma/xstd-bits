name: Test-suite trunk

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

# Weekly, the standard library's own tests at its trunk, read through mappings written for the stable rung's release: an
# early warning of what the next release's tests change and break, and no gate. No pull request runs it and no ruleset
# requires it. Configuration reports each mapping entry trunk has edited rather than failing, so a red run names the
# tests to review before the next release's pin moves to them. GCC trunk alone, the one development rung cpp-ci pins a
# suite for.
on:
  schedule:
    - cron: '23 4 * * 2'
  workflow_dispatch:

jobs:
  libstdcxx:
    uses: rhalbersma/cpp-ci/.github/workflows/gcc.yml@3387d6b86177322b3b2a81b84b45339fc2c47d5c # main after rhalbersma/cpp-ci#101, with each trunk suite test built on its own
    with:
      tiers: development
      build_types: Debug
      cmake_args: -DXSTD_BITS_BUILD_STD_TEST_SUITES=ON -DXSTD_BITS_STD_TEST_SUITE_RUNG=development
