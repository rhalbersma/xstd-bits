name: Toolchain Canary

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

jobs:
  # Dispatched rather than called: a dispatched run is the workflow's own run on main, which its README badge shows,
  # where a called one is filed under this workflow and leaves the badge on whatever main last ran. Nightly, as the
  # one run of every rung and build type: a pull request builds each ladder's floor and ceiling in Debug alone, and
  # dynamic development toolchains and mutable runner images are checked even without a pull request.
  dispatch:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Dispatch the compiler ladders, the analyses and the consumption check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # codeql.yml is absent: it runs on a schedule of its own.
          for workflow in gcc.yml clang.yml clang-libc++.yml mingw.yml apple-clang.yml msvc.yml clang-cl.yml \
                          emscripten.yml sanitizers.yml clang-tidy.yml msvc-analyze.yml consumption.yml; do
            gh workflow run "$workflow" --repo "$REPO" --ref "$REF"
          done
