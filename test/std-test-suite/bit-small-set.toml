# The set<int> tests read against bit_small_set, whose first 64 keys live inside it, in a Boost small_vector.
include = ["xstd/bits/ext/boost/bit_small_set.hpp", "xstd/bits/bit_set/erase_if.hpp", "xstd/bits/bit_set/hash.hpp"]

# libc++ spells set<int> qualified.
[libcxx]
rewrite = [{ from = "std::set<int>", to = "xstd::bit_small_set<64>" }]

# Spelled qualified, or unqualified under a using-directive for std; one with a comparator or allocator of its own stays
# std's.
[libstdcxx]
rewrite = [
    # An explicit instantiation names a class template, which an alias is not.
    { from = "template class std::set<int>;", to = "template class xstd::basic_bit_set<std::size_t, boost::container::small_vector<std::size_t, 1>>;" },
    { from = "std::set<int>", to = "xstd::bit_small_set<64>" },
    { regex = '(?<![\w:])set<int>', to = 'xstd::bit_small_set<64>' },
]

# Spelled qualified, or unqualified under a using-directive for std, as libstdc++'s are.
[msvc-stl]
rewrite = [
    # An explicit instantiation names a class template, which an alias is not.
    { from = "template class std::set<int>;", to = "template class xstd::basic_bit_set<std::size_t, boost::container::small_vector<std::size_t, 1>>;" },
    { from = "std::set<int>", to = "xstd::bit_small_set<64>" },
    { regex = '(?<![\w:])set<int>', to = 'xstd::bit_small_set<64>' },
]

[[libcxx.expect]]
file = "libcxx/test/std/containers/associative/set/get_allocator.pass.cpp"
sha256 = "fc4089ed8899d9c9aed2333bded6b6ee83bd0313f8066ac0240712bea14c12f1"
fails = "compile"
paragraph = "[container.alloc.reqmts]: the set's allocator is its storage's, Boost's small_vector allocator of blocks, not std::allocator<int>"
