# The MSVC STL's tests that name set<int>, with each departure from them named. A subject's mapping beside this one names
# the set they are read against, whose keys are std::size_t.
[msvc-stl]
take = [
    { path = "tests/std/tests", select = '(?<![\w:])set<int>|std::set<int>' },
]

[[msvc-stl.assertion]]
file = "tests/std/tests/Dev10_709168_marking_iterators_as_checked/test.compile.pass.cpp"
sha256 = "1b28f193ecf360cb759335c8235fa94c1abe205a2841c36f9a47ec4dd1dc0d4d"
line = "STATIC_ASSERT(stl_checked2 == _Range_verifiable_v<set<int>::iterator>);"
drop = true
departure = "the MSVC STL's internal _Range_verifiable_v, true only for the iterators it marks as checked"

[[msvc-stl.assertion]]
file = "tests/std/tests/Dev10_709168_marking_iterators_as_checked/test.compile.pass.cpp"
sha256 = "1b28f193ecf360cb759335c8235fa94c1abe205a2841c36f9a47ec4dd1dc0d4d"
line = "STATIC_ASSERT(stl_checked2 == _Range_verifiable_v<set<int>::const_iterator>);"
drop = true
departure = "the MSVC STL's internal _Range_verifiable_v, true only for the iterators it marks as checked"

[[msvc-stl.assertion]]
file = "tests/std/tests/Dev10_709168_marking_iterators_as_checked/test.compile.pass.cpp"
