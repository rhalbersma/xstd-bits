# The MSVC STL marks its own iterators as checked for its debug machinery; a bit vector's are not its own.

[[msvc-stl.assertion]]
file = "tests/std/tests/Dev10_709168_marking_iterators_as_checked/test.compile.pass.cpp"
sha256 = "1b28f193ecf360cb759335c8235fa94c1abe205a2841c36f9a47ec4dd1dc0d4d"
line = "STATIC_ASSERT(stl_checked == _Range_verifiable_v<vector<bool>::iterator>);"
drop = true
departure = "the MSVC STL's internal _Range_verifiable_v, true only for the iterators it marks as checked"

[[msvc-stl.assertion]]
file = "tests/std/tests/Dev10_709168_marking_iterators_as_checked/test.compile.pass.cpp"
sha256 = "1b28f193ecf360cb759335c8235fa94c1abe205a2841c36f9a47ec4dd1dc0d4d"
line = "STATIC_ASSERT(stl_checked == _Range_verifiable_v<vector<bool>::const_iterator>);"
drop = true
departure = "the MSVC STL's internal _Range_verifiable_v, true only for the iterators it marks as checked"

[[msvc-stl.assertion]]
file = "tests/std/tests/Dev10_709168_marking_iterators_as_checked/test.compile.pass.cpp"
sha256 = "1b28f193ecf360cb759335c8235fa94c1abe205a2841c36f9a47ec4dd1dc0d4d"
line = "STATIC_ASSERT(stl_checked == _Range_verifiable_v<vector<bool>::reverse_iterator>);"
drop = true
departure = "the MSVC STL's internal _Range_verifiable_v, true only for the iterators it marks as checked"

[[msvc-stl.assertion]]
file = "tests/std/tests/Dev10_709168_marking_iterators_as_checked/test.compile.pass.cpp"
sha256 = "1b28f193ecf360cb759335c8235fa94c1abe205a2841c36f9a47ec4dd1dc0d4d"
