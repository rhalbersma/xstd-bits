# The MSVC STL keeps hash's argument_type and result_type under _HAS_DEPRECATED_ADAPTOR_TYPEDEFS; the bit vector's hash has neither.

[[msvc-stl.assertion]]
file = "tests/std/tests/P0513R0_poisoning_the_hash/test.cpp"
sha256 = "242167bcf11d228848d0ecc4957facbc0738fcfe2c03e6d06fd20ced92297bc3"
line = "STATIC_ASSERT(standard_hash_enabled<vector<bool>>());"
to = "STATIC_ASSERT(is_trivially_copyable_v<hash<vector<bool>>> && is_trivially_default_constructible_v<hash<vector<bool>>> && noexcept(hash<vector<bool>>{}(declval<const vector<bool>&>())) && hash_disabled<const vector<bool>>() && hash_disabled<volatile vector<bool>>() && hash_disabled<const volatile vector<bool>>());"
departure = "argument_type and result_type, deprecated in C++17 and removed in C++20; the rest of the check is kept"

# [vector.bool.pspc] gives const_reference as bool, which makes const_iterator a constant iterator. A bit vector's is a proxy, so the test's expectations of its four const accesses name the wrong type.

[[msvc-stl.assertion]]
file = "tests/std/tests/P0896R4_ranges_range_machinery/test.cpp"
sha256 = "7478f5a6fe7285d61e75ac3438c7a520e70af38f7cf144741821c574a809773a"
line = "static_assert(test_std_container<std::vector<bool>, std::random_access_iterator_tag>());"
to = "static_assert(test_begin<std::vector<bool>>() && test_end<std::vector<bool>>() && test_rbegin<std::vector<bool>>() && test_rend<std::vector<bool>>() && test_size<std::vector<bool>, std::size_t>() && test_empty<std::vector<bool>, true>() && !ranges::view<std::vector<bool>> && test_begin<std::vector<bool> const>() && test_end<std::vector<bool> const>() && test_rbegin<std::vector<bool> const>() && test_rend<std::vector<bool> const>() && test_size<std::vector<bool> const, std::size_t>() && test_empty<std::vector<bool> const, true>());"
departure = "const_reference is the bit vector's own proxy, so ranges::cbegin, cend, crbegin and crend wrap its iterators in basic_const_iterator; the container's other range accesses are kept"

[[msvc-stl.assertion]]
file = "tests/std/tests/P2278R4_ranges_const_iterator_machinery/test.compile.pass.cpp"
sha256 = "d285f11785397a7c09a1fc3f7391e8236c958ddac51a9a72fa1659b76022a587"
line = "static_assert(same_as<const_iterator<ConstIter>, ConstIter>);"
to = "static_assert(same_as<const_iterator<ConstIter>, conditional_t<same_as<ConstIter, vector<bool>::const_iterator>, basic_const_iterator<ConstIter>, ConstIter>>);"
departure = "const_reference is the bit vector's own proxy, so const_iterator is no constant iterator"

[[msvc-stl.assertion]]
file = "tests/std/tests/P2278R4_ranges_const_iterator_machinery/test.compile.pass.cpp"
sha256 = "d285f11785397a7c09a1fc3f7391e8236c958ddac51a9a72fa1659b76022a587"
line = "static_assert(same_as<const_sentinel<ConstIter>, ConstIter>);"
to = "static_assert(same_as<const_sentinel<ConstIter>, conditional_t<same_as<ConstIter, vector<bool>::const_iterator>, basic_const_iterator<ConstIter>, ConstIter>>);"
departure = "const_reference is the bit vector's own proxy, so const_iterator is no constant iterator"

