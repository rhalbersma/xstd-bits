# The MSVC STL's tests that name vector<bool>, with each departure from them named. A subject's mapping beside this one
# names the type they are read against.
[msvc-stl]
take = [
    { path = "tests/std/tests", select = "vector<bool>" },
]

[[msvc-stl.assertion]]
file = "tests/std/tests/Dev11_0135139_vector_bool_comparisons/test.cpp"
sha256 = "7e586b4f2a2c386086b096c2af9f411185734b2c0b017a04e23b9afacff6c3c6"
line = "x.back().flip();"
to = "x.back() = !x.back();"
departure = "no reference::flip()"

[[msvc-stl.assertion]]
file = "tests/std/tests/Dev11_0135139_vector_bool_comparisons/test.cpp"
sha256 = "7e586b4f2a2c386086b096c2af9f411185734b2c0b017a04e23b9afacff6c3c6"
line = "y.back().flip();"
to = "y.back() = !y.back();"
departure = "no reference::flip()"

