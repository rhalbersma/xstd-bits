# The test's helpers call std::erase_if qualified over every container it instantiates, the bit vector among them.
[[msvc-stl.assertion]]
file = "tests/std/tests/VSO_0000000_instantiate_containers/test.compile.pass.cpp"
sha256 = "690dfaa178c5a86134618366a36bd40526bc843bc817dd1b877fdff305357b80"
line = "std::erase_if(value, pr1);"
to = "if constexpr (is_same_v<T, vector<bool>>) { xstd::erase_if(value, pr1); } else { std::erase_if(value, pr1); }"
departure = "erase_if is xstd's, called qualified as the test calls std's, so that no argument-dependent lookup completes its predicate's type"

[[msvc-stl.assertion]]
