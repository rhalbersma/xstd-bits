sha256 = "c5fde58179929c96e18f076ec237c7ee0e6950ed65bf24b15d8a0a995c66fc12"
line = "static_assert(is_same_v<decltype(vb1), vector<bool>>);"
drop = true
departure = "class template argument deduction names std::vector, which deduces std::vector<bool> where the rewrite names the bit vector"

