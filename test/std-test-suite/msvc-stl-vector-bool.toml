departure = "erase_if is xstd's, called qualified as the test calls std's, so that no argument-dependent lookup completes its predicate's type"


# MSVC exports the specializations of a static member variable template that a base's members instantiate, and rejects
# them as having no storage class to export: C2071 on the newest compiler, an internal compiler error on VS 2022.
[[msvc-stl.expect]]
file = "tests/std/tests/GH_001638_dllexport_derived_classes/test.compile.pass.cpp"
sha256 = "8f5be5f6ee2be8103515818659d69b8c85ef4b74b347b9d1d94526b3d7d5cc10"
fails = "compile"
paragraph = "none of the bit vector's: MSVC rejects exporting a class whose base instantiates a static data member template, reported as rhalbersma/xstd-bits#529"
