# The set<int> tests read against bit_fixed_set, whose 128 keys are fixed by its type.
include = ["xstd/bits/bit_set/bit_fixed_set.hpp", "xstd/bits/bit_set/erase_if.hpp"]

# libc++ spells set<int> qualified.
[libcxx]
rewrite = [{ from = "std::set<int>", to = "xstd::bit_fixed_set<128>" }]

# Spelled qualified, or unqualified under a using-directive for std; one with a comparator or allocator of its own stays
# std's.
[libstdcxx]
rewrite = [
    # An explicit instantiation names a class template, which an alias is not.
    { from = "template class std::set<int>;", to = "template class xstd::basic_bit_fixed_set<std::size_t, std::size_t, 128>;" },
    { from = "std::set<int>", to = "xstd::bit_fixed_set<128>" },
    { regex = '(?<![\w:])set<int>', to = 'xstd::bit_fixed_set<128>' },
]

[[libstdcxx.assertion]]
file = "libstdc++-v3/testsuite/23_containers/set/cons/moveable.cc"
sha256 = "dd6e842f78a8e2a8683857a8ef1068dbb7c8f25945b1249521fe1064fcade182"
line = "VERIFY( b.find(2) == b.end());"
drop = true
departure = "[container.reqmts] leaves a moved-from container's value unspecified: libstdc++'s nodes leave it empty, and a fixed set's array of blocks moves by copying"

[[libcxx.expect]]
file = "libcxx/test/std/containers/associative/set/get_allocator.pass.cpp"
sha256 = "fc4089ed8899d9c9aed2333bded6b6ee83bd0313f8066ac0240712bea14c12f1"
fails = "compile"
paragraph = "[container.alloc.reqmts]: a fixed set allocates nothing, so it has no allocator to return"

[[libstdcxx.expect]]
file = "libstdc++-v3/testsuite/23_containers/set/cons/noexcept_move_construct.cc"
sha256 = "c85c45fb35708fdf211038d32e8bd4925a9a8eda600f1d92645c45aa07264a8d"
fails = "compile"
paragraph = "[container.alloc.reqmts]: a fixed set allocates nothing, so it has no allocator_type to move with"
