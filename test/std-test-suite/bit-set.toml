# The set<int> tests read against bit_set, whose storage grows with its largest key.
include = ["xstd/bits/bit_set/bit_set.hpp", "xstd/bits/bit_set/erase_if.hpp"]

# libc++ spells set<int> qualified.
[libcxx]
rewrite = [{ from = "std::set<int>", to = "xstd::bit_set" }]

# Spelled qualified, or unqualified under a using-directive for std; one with a comparator or allocator of its own stays
# std's.
[libstdcxx]
rewrite = [
    # An explicit instantiation names a class template, which an alias is not.
    { from = "template class std::set<int>;", to = "template class xstd::basic_bit_set<std::size_t>;" },
    { from = "std::set<int>", to = "xstd::bit_set" },
    { regex = '(?<![\w:])set<int>', to = 'xstd::bit_set' },
]
