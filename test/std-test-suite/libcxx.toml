# libc++'s tests of std::vector<bool>, the one container its suite writes against a proxy reference, read against
# bit_vector.
[libcxx]
take = [{ path = "libcxx/test/std/containers/sequences/vector.bool" }]
include = ["xstd/bits/bit_vector.hpp"]
rewrite = [{ from = "std::vector<bool>", to = "xstd::bit_vector" }]

# libc++'s own invariant check names a member only its vector<bool> has; the paragraph's guarantees are asserted beside it.
[[libcxx.assertion]]
file = "libcxx/test/std/containers/sequences/vector.bool/construct_default.pass.cpp"
sha256 = "91e7235d968d312105753e0900d2774d2b4c22d328dff4e01924803c9d9f41c1"
line = "LIBCPP_ASSERT(c.__invariants());"
drop = true
departure = "libc++'s internal __invariants()"

[[libcxx.assertion]]
file = "libcxx/test/std/containers/sequences/vector.bool/construct_default.pass.cpp"
sha256 = "91e7235d968d312105753e0900d2774d2b4c22d328dff4e01924803c9d9f41c1"
line = "LIBCPP_ASSERT(c1.__invariants());"
drop = true
departure = "libc++'s internal __invariants()"

[[libcxx.assertion]]
file = "libcxx/test/std/containers/sequences/vector.bool/construct_iter_iter.pass.cpp"
sha256 = "c858cf3457f94615e611d11fa37535543ff20825ac6fc17c13a73db91e264684"
line = "LIBCPP_ASSERT(c.__invariants());"
drop = true
departure = "libc++'s internal __invariants()"

[[libcxx.assertion]]
file = "libcxx/test/std/containers/sequences/vector.bool/construct_iter_iter_alloc.pass.cpp"
sha256 = "20896f7a3a5190983a56e1b06fe923d3da59e3897fa5900ab82d557b141dd066"
line = "LIBCPP_ASSERT(c.__invariants());"
drop = true
departure = "libc++'s internal __invariants()"

[[libcxx.assertion]]
file = "libcxx/test/std/containers/sequences/vector.bool/construct_size.pass.cpp"
sha256 = "cadd143ad1be3268aa333f3240255cae78980589795db98fbc680735fba9b93b"
line = "LIBCPP_ASSERT(c.__invariants());"
drop = true
departure = "libc++'s internal __invariants()"

[[libcxx.assertion]]
file = "libcxx/test/std/containers/sequences/vector.bool/construct_size_value.pass.cpp"
sha256 = "a95b41f6af6a8fa1a394e2270920a6f31392c1e05896e87111fcb548ca7781ad"
line = "LIBCPP_ASSERT(c.__invariants());"
drop = true
departure = "libc++'s internal __invariants()"

[[libcxx.assertion]]
file = "libcxx/test/std/containers/sequences/vector.bool/construct_size_value_alloc.pass.cpp"
sha256 = "239cc590980b5468e9397cb6417ca8bdd6488143e1ab7899ec9165949f9a0504"
line = "LIBCPP_ASSERT(c.__invariants());"
drop = true
departure = "libc++'s internal __invariants()"

[[libcxx.assertion]]
file = "libcxx/test/std/containers/sequences/vector.bool/copy.pass.cpp"
sha256 = "099b47ccca0a2dfdb2ff6b04dfd90424d2c90f93eb46061108170a40dfe366ca"
line = "LIBCPP_ASSERT(c.__invariants());"
drop = true
departure = "libc++'s internal __invariants()"

[[libcxx.assertion]]
file = "libcxx/test/std/containers/sequences/vector.bool/copy_alloc.pass.cpp"
sha256 = "85df1926257b925fec12caeed7faf3672229040d195f4d1531b10c8a0a30500e"
line = "LIBCPP_ASSERT(c.__invariants());"
drop = true
departure = "libc++'s internal __invariants()"

# The word the libc++-only block measures its capacity in is the value type of bit_vector's block container.
[[libcxx.assertion]]
file = "libcxx/test/std/containers/sequences/vector.bool/shrink_to_fit.pass.cpp"
sha256 = "0728d15aaa564c44bb8411abd91a35bd87a8298987d2284293a93e86518c1a4a"
line = "unsigned bits_per_word = static_cast<unsigned>(sizeof(C::__storage_type) * CHAR_BIT);"
to = "unsigned bits_per_word = static_cast<unsigned>(sizeof(C::block_container_type::value_type) * CHAR_BIT);"
departure = "libc++'s internal __storage_type, which is bit_vector's block_container_type::value_type"

# The rewrite reaches the container and not the class template argument deduction it is compared with.
[[libcxx.assertion]]
file = "libcxx/test/std/containers/sequences/vector.bool/assign_range.pass.cpp"
sha256 = "2597e4d51293c0e5e631cff3b0dc00554f33dd6264db492ee397bb58fa6c13be"
line = "assert(v == (std::vector{true, true, false}));"
to = "assert(std::ranges::equal(v, std::vector{true, true, false}));"
departure = "no == between bit_vector and std::vector<bool>"

[[libcxx.assertion]]
file = "libcxx/test/std/containers/sequences/vector.bool/insert_range.pass.cpp"
sha256 = "74eee090d5000e2a38e986e39895e7b29b944e3dbde136aedb6787ed56640152"
line = "assert(v == (std::vector{true, true, false}));"
to = "assert(std::ranges::equal(v, std::vector{true, true, false}));"
departure = "no == between bit_vector and std::vector<bool>"

# std::find walks bit_vector's iterators a bit at a time, past Clang's constant-evaluation step limit; the run-time half is kept.
[[libcxx.assertion]]
file = "libcxx/test/std/containers/sequences/vector.bool/find.pass.cpp"
sha256 = "ce82dff5fad1230ff99fc840c68fb6043444eaffdea8e2303769136501825b9b"
line = "static_assert(tests());"
drop = true
departure = "libc++'s word-wise find over its own __bit_iterator"

# [vector.bool.pspc] gives const_reference as bool; bit_vector's is a proxy, as libc++'s own is under its default ABI.
[[libcxx.assertion]]
file = "libcxx/test/std/containers/sequences/vector.bool/const_reference.pass.cpp"
sha256 = "b2c54fc371d858255f12176d0bd81261fb309f4c74e6cfdcc76e1e650ca07779"
line = "ASSERT_SAME_TYPE(CRefT, std::__bit_const_reference<std::vector<bool> >);"
drop = true
departure = "const_reference is bit_vector's own proxy"

[[libcxx.assertion]]
file = "libcxx/test/std/containers/sequences/vector.bool/iterators.pass.cpp"
sha256 = "4b0f26352d9b48f8962149dab9b46647ede1fa17dda2c1a0ee697336629b4252"
line = "ASSERT_SAME_TYPE(ConstIterRefT, std::__bit_const_reference<std::vector<bool> >);"
drop = true
departure = "const_reference is bit_vector's own proxy"

# [vector.bool.pspc] gives allocator_type as Allocator over bool; bit_vector's is its block container's.
[[libcxx.assertion]]
file = "libcxx/test/std/containers/sequences/vector.bool/types.pass.cpp"
sha256 = "174730a46512add8952033d489f06d7df3fe22ebbc4dab7c40b353382e58103f"
line = "static_assert((std::is_same<std::vector<bool>::allocator_type, std::allocator<bool> >::value), \"\");"
drop = true
departure = "allocator_type is the block container's allocator"

# [vector.bool.pspc] gives reference a flip(); bit_vector's reference assigns its negation instead.
[[libcxx.assertion]]
file = "libcxx/test/std/containers/sequences/vector.bool/reference/ctor_copy.pass.cpp"
sha256 = "3b5e218787b78ee3300e6d4b6bf7c00963d70e4570fa1e50152789ab368c1ef3"
line = "ref.flip();"
to = "ref = !ref;"
departure = "no reference::flip()"

[[libcxx.expect]]
file = "libcxx/test/std/containers/sequences/vector.bool/reference/flip.pass.cpp"
sha256 = "14c46e44ed31299acde45c92a0b23eb11ca64addf8929ccdec8ab5a3bf083b80"
fails = "compile"
paragraph = "[vector.bool.pspc]"

# [vector.bool.pspc] gives vector<bool> a static swap(reference, reference); bit_vector swaps two references with std::swap.
[[libcxx.expect]]
file = "libcxx/test/std/containers/sequences/vector.bool/reference.swap.pass.cpp"
sha256 = "61152ce772dcfb1ff7ac8f64e0d270416a4bb27f2317fbcfccfb2d15414aee2d"
fails = "compile"
paragraph = "[vector.bool.pspc]"

# The helper is written over std::vector<bool, Alloc> and its libc++-only __storage_type, so bit_vector cannot reach it.
[[libcxx.assertion]]
file = "libcxx/test/std/containers/sequences/vector.bool/max_size.pass.cpp"
sha256 = "54d60eacfd4e4b899f2f2d671d90083411506a5cff970d485bc5844aaa379011"
line = "test(std::vector<bool>());"
drop = true
departure = "a helper over std::vector<bool, Alloc>"
