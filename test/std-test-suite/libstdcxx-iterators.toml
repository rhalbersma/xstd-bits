# libstdc++'s iterator tests over std::vector<bool>'s iterators, which run the iterator adaptors and concepts over a
# subject's, with each departure from them named.
[libstdcxx]
take = [
    { path = "libstdc++-v3/testsuite/24_iterators", select = "vector<bool>" },
]
