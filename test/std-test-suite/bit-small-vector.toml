# The vector<bool> tests read against bit_small_vector, whose first 64 bits live inside it, in a Boost small_vector.
include = ["xstd/bits/ext/boost/bit_small_vector.hpp"]

# libc++ spells vector<bool> qualified.
[libcxx]
rewrite = [{ from = "std::vector<bool>", to = "xstd::bit_small_vector<64>" }]

# Spelled qualified, or unqualified under a using-directive for std; one with an allocator of its own stays std's.
[libstdcxx]
rewrite = [
    { from = "std::vector<bool>", to = "xstd::bit_small_vector<64>" },
    { regex = '(?<![\w:])vector<bool>', to = 'xstd::bit_small_vector<64>' },
]

[msvc-stl]
rewrite = [
    { from = "std::vector<bool>", to = "xstd::bit_small_vector<64>" },
    { regex = '(?<![\w:])vector<bool>', to = 'xstd::bit_small_vector<64>' },
]

