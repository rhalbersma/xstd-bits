# The MSVC STL's own tests of vector<bool>, read against bit_vector, and of std::set over int keys, read against bit_set,
# whose keys are std::size_t. Each rewrite names one type, so a test reached by none is not run; each departure is named.

[msvc-stl]
take = [
    { path = "tests/std/tests/Dev10_689595_back_inserter_vector_bool" },
    { path = "tests/std/tests/Dev10_816787_swap_vector_bool_elements" },
    { path = "tests/std/tests/Dev11_0135139_vector_bool_comparisons" },
    { path = "tests/std/tests/GH_000625_vector_bool_optimization" },
    { path = "tests/std/tests/Dev10_563443_empty_vector_begin_plus_zero" },
    { path = "tests/std/tests/Dev10_766948_insert_ambiguity" },
    { path = "tests/std/tests/P1206R7_set_from_range" },
    { path = "tests/std/tests/P1206R7_set_insert_range" },
    { path = "tests/std/tests/P1206R7_vector_append_range" },
    { path = "tests/std/tests/P1206R7_vector_assign_range" },
    { path = "tests/std/tests/P1206R7_vector_from_range" },
    { path = "tests/std/tests/P1206R7_vector_insert_range" },
    { path = "tests/std/tests/P1209R0_erase_if_erase" },
]
include = [
    "xstd/bits/bit_set/bit_set.hpp",
    "xstd/bits/bit_set/erase_if.hpp",
    "xstd/bits/bit_vector.hpp",
]
# The tests name both unqualified, under a using-directive for std; one with an allocator or comparator of its own stays
# std's.
rewrite = [
    { from = "std::vector<bool>", to = "xstd::bit_vector" },
    { regex = '(?<![\w:])vector<bool>', to = 'xstd::bit_vector' },
    { from = "std::set<int>", to = "xstd::bit_set" },
    { regex = '(?<![\w:])set<int>', to = 'xstd::bit_set' },
]

[[msvc-stl.assertion]]
file = "tests/std/tests/Dev11_0135139_vector_bool_comparisons/test.cpp"
sha256 = "7e586b4f2a2c386086b096c2af9f411185734b2c0b017a04e23b9afacff6c3c6"
line = "x.back().flip();"
to = "x.back() = !x.back();"
departure = "no reference::flip()"

[[msvc-stl.assertion]]
file = "tests/std/tests/Dev11_0135139_vector_bool_comparisons/test.cpp"
sha256 = "7e586b4f2a2c386086b096c2af9f411185734b2c0b017a04e23b9afacff6c3c6"
line = "y.back().flip();"
to = "y.back() = !y.back();"
departure = "no reference::flip()"

[[msvc-stl.assertion]]
file = "tests/std/tests/GH_000625_vector_bool_optimization/test.cpp"
sha256 = "f8a75dba8e3465bc78fae3a63b25fde409220551a2e264c8fcb9967d859e2430"
line = 'static_assert(blockSize == _VBITS, "Invalid block size");'
drop = true
departure = "the MSVC STL's internal _VBITS, the width of its words; the test's data crosses word boundaries at any width"

[[msvc-stl.assertion]]
file = "tests/std/tests/GH_000625_vector_bool_optimization/test.cpp"
sha256 = "f8a75dba8e3465bc78fae3a63b25fde409220551a2e264c8fcb9967d859e2430"
line = "input_true[length + 1].flip();"
to = "input_true[length + 1] = !input_true[length + 1];"
departure = "no reference::flip()"

[[msvc-stl.assertion]]
file = "tests/std/tests/GH_000625_vector_bool_optimization/test.cpp"
sha256 = "f8a75dba8e3465bc78fae3a63b25fde409220551a2e264c8fcb9967d859e2430"
line = "input_false[length + 1].flip();"
to = "input_false[length + 1] = !input_false[length + 1];"
departure = "no reference::flip()"

[[msvc-stl.assertion]]
file = "tests/std/tests/GH_000625_vector_bool_optimization/test.cpp"
sha256 = "f8a75dba8e3465bc78fae3a63b25fde409220551a2e264c8fcb9967d859e2430"
line = "input_true[0].flip();"
to = "input_true[0] = !input_true[0];"
departure = "no reference::flip()"

[[msvc-stl.assertion]]
file = "tests/std/tests/GH_000625_vector_bool_optimization/test.cpp"
sha256 = "f8a75dba8e3465bc78fae3a63b25fde409220551a2e264c8fcb9967d859e2430"
line = "input_false[0].flip();"
to = "input_false[0] = !input_false[0];"
departure = "no reference::flip()"

[[msvc-stl.assertion]]
file = "tests/std/tests/GH_000625_vector_bool_optimization/test.cpp"
sha256 = "f8a75dba8e3465bc78fae3a63b25fde409220551a2e264c8fcb9967d859e2430"
line = "void print_vec(const char* const name, const vector<T>& v) {"
to = "void print_vec(const char* const name, const T& v) {"
departure = "the test's diagnostic helper takes a std::vector<T>, which bit_vector is not, so it deduces the container instead"