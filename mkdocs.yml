theme:
  name: material
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.path
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# The reference index's relation table keeps each entity name on one line.
extra_css:
  - stylesheets/reference.css

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - md_in_html

validation:
  links:
    anchors: warn
    unrecognized_links: warn
